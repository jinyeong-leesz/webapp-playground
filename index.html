<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장기요양 실무노트</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>장기요양 실무노트</h1>
    <p class="subtitle">방문요양 · 주·야간보호 · 요양원 업무를 분류별로 찾아보세요.</p>
  </header>

  <main class="container">
    <div class="controls">
      <input id="search" type="search" placeholder="검색 (예: 외박, 한도액, 청구 취소)" aria-label="검색">

      <div class="filter-group" role="group" aria-label="업무 종류">
        <span class="filter-label">업무</span>
        <div id="type-filters" class="chips"></div>
      </div>

      <nav id="cat-tabs" class="tabs" aria-label="분류"></nav>
    </div>

    <p id="result-count" class="result-count"></p>
    <div id="list" class="list"></div>
  </main>

  <footer class="site-footer">
    <p>확인 기준일: <span id="updated"></span>. 수가·고시번호는 수시로 바뀌니 업무에 쓰기 전 원문을 다시 확인하세요.</p>
    <p>이 앱은 참고용입니다. 해석이 필요한 사항은 관할 공단 장기요양센터(1577-1000)나 관할 지자체에 문의하세요.</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
